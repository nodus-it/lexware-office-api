# GitLab CI/CD Pipeline for Lexware Office API Package
# Tests the package against multiple PHP versions to ensure compatibility

stages:
  - test
  - quality
  - security

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

# Cache composer dependencies
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .composer-cache/
    - vendor/

# Base job template for PHP testing
.php_test_template: &php_test_template
  stage: test
  before_script:
    # Install system dependencies
    - apt-get update -qq && apt-get install -y -qq git unzip
    
    # Install Composer
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    
    # Configure Composer cache
    - composer config cache-dir $COMPOSER_CACHE_DIR
    
    # Install dependencies
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --optimize-autoloader
    
    # Validate composer.json and composer.lock
    - composer validate --strict
  script:
    # Run PHPUnit tests
    - vendor/bin/phpunit --configuration phpunit.xml --coverage-text --colors=never
    
    # Run PHP syntax check
    - find src tests -name "*.php" -exec php -l {} \;
  artifacts:
    reports:
      junit: tests/results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: tests/results/coverage.xml
    paths:
      - tests/results/
    expire_in: 1 week
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'

# PHP 8.1 (Minimum supported version)
test:php8.1:
  <<: *php_test_template
  image: php:8.1-cli
  before_script:
    - !reference [.php_test_template, before_script]
    # Install PHP extensions
    - docker-php-ext-install bcmath

# PHP 8.2 (Current stable)
test:php8.2:
  <<: *php_test_template
  image: php:8.2-cli
  before_script:
    - !reference [.php_test_template, before_script]
    # Install PHP extensions
    - docker-php-ext-install bcmath

# PHP 8.3 (Latest stable)
test:php8.3:
  <<: *php_test_template
  image: php:8.3-cli
  before_script:
    - !reference [.php_test_template, before_script]
    # Install PHP extensions
    - docker-php-ext-install bcmath

# PHP 8.4 (Development version - allow failure)
test:php8.4:
  <<: *php_test_template
  image: php:8.4-rc-cli
  before_script:
    - !reference [.php_test_template, before_script]
    # Install PHP extensions
    - docker-php-ext-install bcmath
  allow_failure: true

# Code Quality Analysis
code_quality:
  stage: quality
  image: php:8.2-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer config cache-dir $COMPOSER_CACHE_DIR
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --optimize-autoloader
  script:
    # PHP CodeSniffer (PSR-12 compliance)
    - |
      if [ -f "vendor/bin/phpcs" ]; then
        vendor/bin/phpcs --standard=PSR12 --extensions=php src/ tests/ || echo "PHPCS not configured"
      else
        echo "PHPCS not installed - skipping code style check"
      fi
    
    # PHPStan (Static Analysis)
    - |
      if [ -f "vendor/bin/phpstan" ]; then
        vendor/bin/phpstan analyse src/ --level=5 || echo "PHPStan not configured"
      else
        echo "PHPStan not installed - skipping static analysis"
      fi
    
    # PHP Mess Detector
    - |
      if [ -f "vendor/bin/phpmd" ]; then
        vendor/bin/phpmd src/ text cleancode,codesize,controversial,design,naming,unusedcode || echo "PHPMD not configured"
      else
        echo "PHPMD not installed - skipping mess detection"
      fi
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

# Security Analysis
security_check:
  stage: security
  image: php:8.2-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer config cache-dir $COMPOSER_CACHE_DIR
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --optimize-autoloader
  script:
    # Composer security audit
    - composer audit --format=plain
    
    # Check for known security vulnerabilities in dependencies
    - |
      if command -v symfony &> /dev/null; then
        symfony security:check
      else
        echo "Symfony CLI not available - using composer audit only"
      fi
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

# Dependency Update Check (scheduled)
dependency_check:
  stage: quality
  image: php:8.2-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    # Check for outdated dependencies
    - composer outdated --direct --strict
    
    # Validate composer files
    - composer validate --strict --no-check-all
  allow_failure: true
  only:
    variables:
      - $CI_PIPELINE_SOURCE == "schedule"

# Performance Test (optional)
performance_test:
  stage: test
  image: php:8.2-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer config cache-dir $COMPOSER_CACHE_DIR
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --optimize-autoloader
  script:
    # Run performance benchmarks if available
    - |
      if [ -f "tests/Performance/BenchmarkTest.php" ]; then
        vendor/bin/phpunit tests/Performance/ --group=performance
      else
        echo "No performance tests found - skipping"
      fi
  allow_failure: true
  only:
    - merge_requests
    - main
  when: manual

# Documentation Generation (for main branch)
generate_docs:
  stage: quality
  image: php:8.2-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer config cache-dir $COMPOSER_CACHE_DIR
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --optimize-autoloader
  script:
    # Generate API documentation if phpDocumentor is available
    - |
      if [ -f "vendor/bin/phpdoc" ]; then
        vendor/bin/phpdoc -d src/ -t docs/api/
      else
        echo "phpDocumentor not installed - skipping documentation generation"
      fi
  artifacts:
    paths:
      - docs/
    expire_in: 30 days
  only:
    - main
  allow_failure: true

# Deployment preparation (tags only)
prepare_release:
  stage: quality
  image: php:8.2-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer config cache-dir $COMPOSER_CACHE_DIR
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --optimize-autoloader --no-dev
  script:
    # Validate that all tests pass
    - vendor/bin/phpunit --configuration phpunit.xml --no-coverage
    
    # Create release archive
    - tar -czf lexware-office-api-${CI_COMMIT_TAG}.tar.gz --exclude='.git*' --exclude='tests' --exclude='.gitlab-ci.yml' .
  artifacts:
    paths:
      - lexware-office-api-*.tar.gz
    expire_in: 1 year
  only:
    - tags